[package]
name = "rustsystem-server"
version = "0.1.0"
edition = "2024"
authors.workspace = true

[dependencies]
axum.workspace = true
axum-server = "0.7.2"
axum-extra = { version = "0.10.1", features = ["cookie"] }
serde.workspace = true
serde_json = "1.0.140"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower-http = { version = "0.6.4", features = ["fs"] }
reqwest = { version = "0.13.2", features = ["json"] }
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
rand = "0.9.1"
base64 = "0.22.1"
chrono = "0.4.41"
qrcode = "0.14.1"
x25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"

rustsystem-core = { path = "../rustsystem-core" }

[dev-dependencies]
rustsystem-trustauth = { path = "../rustsystem-trustauth" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
argon2 = "0.5"
reqwest = { version = "0.13.2", features = ["json", "cookies"] }

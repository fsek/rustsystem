name: CI

on:
  push:
    branches: [stage, v2.1]
  pull_request:
    branches: [stage, main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit and end-to-end tests run both services in-process; no certificates or env needed.
      - name: Run tests
        run: cargo test --workspace

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Uses the version pinned in frontend/package.json's packageManager.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        run: pnpm build

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Uses the version pinned in frontend/package.json's packageManager.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Generate mTLS certificates
        working-directory: mtls
        run: bash mkcerts.sh dev

      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Start services
        env:
          RUSTSYSTEM_DISABLE_RATE_LIMIT: "1"
        run: |
          source .env
          cargo build --bin rustsystem-server --bin rustsystem-trustauth
          MTLS_CERT=mtls/trustauth/trustauth.crt MTLS_KEY=mtls/trustauth/trustauth.key ./target/debug/rustsystem-trustauth &
          MTLS_CERT=mtls/server/server.crt MTLS_KEY=mtls/server/server.key ./target/debug/rustsystem-server &
          until curl -sf localhost:1443/api/config >/dev/null; do sleep 1; done

      - name: Install browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        working-directory: frontend
        run: pnpm test:e2e
